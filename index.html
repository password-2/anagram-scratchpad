<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anagram">
<meta name="theme-color" content="#f6f3ec">
<title>Anagram Scratchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --ink:#1d1d1f; --muted:#8a857a; --line:#d9d3c6;
  --field:#fffdf8; --accent:#c0392b; --hl:rgba(192,57,43,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17171a; --ink:#ece9e2; --muted:#8d8a84; --line:#34343a;
    --field:#202024; --accent:#ff6b5b; --hl:rgba(255,107,91,.15);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0 0 12px;color:var(--muted);text-transform:uppercase}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input{
  width:100%;font:600 18px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);outline:none
}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted);letter-spacing:.02em;text-transform:none;font-weight:400}
.fields{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.count{font-size:12px;color:var(--muted);margin:6px 0 10px;min-height:16px}
.count .bad{color:var(--accent)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{
  font:600 13px Inter,system-ui,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--field);color:var(--ink)
}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.opts{display:none;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:-2px 0 10px;font-size:12px;color:var(--muted)}
.opts.show{display:flex}
.opts label{display:flex;align-items:center;gap:8px;margin:0;flex:1 1 140px}
.opts input[type=range]{flex:1;width:auto;min-width:0;accent-color:var(--accent);padding:0;border:0;background:none}
.opts output{min-width:52px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.opts button{padding:6px 10px;font-size:12px}
#board{
  position:relative;width:100%;aspect-ratio:1;border:1px dashed var(--line);border-radius:16px;
  touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none
}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
.tile{
  position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;display:flex;align-items:center;justify-content:center;
  font:600 38px/1 Caveat,cursive;color:var(--ink);cursor:grab;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:left .35s ease,top .35s ease,opacity .2s,transform .35s ease
}
.tile.used{opacity:.15;cursor:default}
.tile.drag{transition:none;z-index:10;color:var(--accent);cursor:grabbing}
#slots{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;margin-top:16px;min-height:52px}
.slot{
  width:clamp(22px,7.5vw,36px);height:48px;border-bottom:2.5px solid var(--ink);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;
  font:600 34px/1 Caveat,cursive;color:var(--ink);cursor:pointer;border-radius:4px 4px 0 0
}
.slot.gap{margin-right:16px}
.slot.fixed{color:var(--accent);cursor:default}
.slot.over{background:var(--hl)}
</style>
</head>
<body>
<h1>Anagram scratchpad</h1>

<div class="fields">
  <div>
    <label for="fodder">Fodder</label>
    <input id="fodder" placeholder="e.g. dormitory" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
  </div>
  <div>
    <label for="pattern">Answer</label>
    <input id="pattern" placeholder="4,5 or _A__E" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
  </div>
</div>
<div class="count" id="count"></div>

<div class="bar">
  <button data-layout="circle" class="on">Circle</button>
  <button data-layout="spiral">Spiral</button>
  <button data-layout="scatter">Scatter</button>
  <span class="spacer"></span>
  <button id="shuffle">Shuffle</button>
  <button id="clear">Clear</button>
</div>

<div class="opts" id="opt-spiral">
  <label>Turns <input type="range" id="turns" min="0.5" max="5" step="0.25" value="2"><output id="turnsOut"></output></label>
  <label>Noise <input type="range" id="noise" min="0" max="100" step="5" value="0"><output id="noiseOut"></output></label>
</div>
<div class="opts" id="opt-scatter">
  <button data-gather="0" class="on">Loose</button>
  <button data-gather="1">Gather</button>
</div>

<div id="board"><div id="hint">Type the fodder above</div></div>
<div id="slots"></div>

<script>
const $ = s => document.querySelector(s);
const board = $('#board'), slotsEl = $('#slots'), hint = $('#hint');
const fodderIn = $('#fodder'), patIn = $('#pattern'), countEl = $('#count');

let tiles = [], slots = [];

// remembered per device; page works fine without storage
const settings = { layout: 'circle', turns: 2, noise: 0, gather: 0 };
try { Object.assign(settings, JSON.parse(localStorage.getItem('anagram-settings') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('anagram-settings', JSON.stringify(settings)); } catch (e) {} };
let layout = settings.layout;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const letters = s => s.toUpperCase().replace(/[^A-Z]/g, '').split('');

// Answer field: blank = one slot per fodder letter; "4,5" = enumeration; "_A__E" = pattern with known crossers
function parsePattern(p, n) {
  p = p.trim().toUpperCase();
  const out = [];
  if (!p) { for (let i = 0; i < n; i++) out.push({ fixed: null, tile: null, gap: false }); return out; }
  if (/^[\d\s,\-]+$/.test(p)) {
    const groups = p.split(/[\s,\-]+/).filter(Boolean).map(Number);
    groups.forEach((g, gi) => { for (let i = 0; i < g; i++) out.push({ fixed: null, tile: null, gap: i === g - 1 && gi < groups.length - 1 }); });
    return out;
  }
  for (const c of p) {
    if (/[\s,\-\/]/.test(c)) { if (out.length) out[out.length - 1].gap = true; continue; }
    out.push({ fixed: /[A-Z]/.test(c) ? c : null, tile: null, gap: false });
  }
  return out;
}

function buildSlots() {
  tiles.forEach(t => t.used = false);
  slots = parsePattern(patIn.value, tiles.length);
  // known crossers use up a matching fodder letter
  slots.forEach(s => {
    if (!s.fixed) return;
    const t = tiles.find(t => !t.used && t.ch === s.fixed);
    if (t) { t.used = true; s.tile = t.id; }
  });
}

function build() {
  tiles = letters(fodderIn.value).map((ch, id) => ({ id, ch, used: false, x: .5, y: .5, rot: 0 }));
  board.querySelectorAll('.tile').forEach(e => e.remove());
  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile'; el.textContent = t.ch; el.dataset.id = t.id;
    el.addEventListener('pointerdown', onDown);
    board.appendChild(el); t.el = el;
  });
  buildSlots();
  roll = null;
  arrange(false);
  render();
}

// ---- layouts (positions are fractions of the board) ----
function circle(n) {
  const r = n === 1 ? 0 : .38, off = Math.random() * Math.PI * 2;
  return Array.from({ length: n }, (_, i) => [.5 + r * Math.cos(off + i * 2 * Math.PI / n), .5 + r * Math.sin(off + i * 2 * Math.PI / n)]);
}
// Archimedean spiral r = theta, from the centre out to `turns` full turns.
// Letters sit at equal arc-length steps, so spacing adapts to the fodder length.
// Noise nudges each letter along the curve and in/out across it, by a fixed per-shuffle random amount.
function spiral(n) {
  const T = settings.turns, nz = settings.noise / 100;
  const thMax = 2 * Math.PI * T, M = 1500;
  const th = [], L = [0];
  for (let k = 0; k <= M; k++) th.push(thMax * k / M);
  for (let k = 1; k <= M; k++) L.push(L[k - 1] + Math.hypot(1, (th[k] + th[k - 1]) / 2) * (th[k] - th[k - 1]));
  const Ltot = L[M], ds = n > 1 ? Ltot / (n - 1) : 0;
  const thetaAt = s => {
    s = Math.max(0, Math.min(Ltot, s));
    let lo = 0, hi = M;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; L[m] < s ? lo = m : hi = m; }
    const f = (s - L[lo]) / ((L[hi] - L[lo]) || 1);
    return th[lo] + f * (th[hi] - th[lo]);
  };
  const ring = 2 * Math.PI;                      // gap between successive turns
  const k = .42 / (thMax + nz * ring * .5);      // keep noisy outer letters on the board
  return Array.from({ length: n }, (_, i) => {
    const [ja, jr] = roll.jit[i];
    const t = thetaAt(i * ds + ja * nz * .45 * ds);
    const r = Math.max(0, t + jr * nz * .5 * ring);
    const a = roll.dir * t + roll.off;
    let x = r * Math.cos(a), y = r * Math.sin(a);
    if (i === 0 && n > 1) { x += ja * nz * ring * .5; y += jr * nz * ring * .5; }   // centre letter: plain wobble
    return [.5 + x * k, .5 + y * k];
  });
}
// Pull scattered points toward the centre while pushing apart any that are too close,
// so they settle into a loose clump with roughly even gaps.
function gather(pts) { return relax(pts, 60, .04, 300, true); }
// push apart letters closer than `gapPx`; `pull` > 0 also draws everything toward the centre
function relax(pts, gapPx, pull, iters, recentre) {
  const W = board.clientWidth || 360, d = gapPx / W;
  pts = pts.map(p => p.slice());
  for (let it = 0; it < iters; it++) {
    if (pull) for (const p of pts) { p[0] += (.5 - p[0]) * pull; p[1] += (.5 - p[1]) * pull; }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j];
      let dx = b[0] - a[0], dy = b[1] - a[1], dist = Math.hypot(dx, dy);
      if (dist >= d) continue;
      if (dist < 1e-6) { dx = Math.random() - .5; dy = Math.random() - .5; dist = Math.hypot(dx, dy); }
      const push = (d - dist) / 2 / dist;
      a[0] -= dx * push; a[1] -= dy * push; b[0] += dx * push; b[1] += dy * push;
    }
  }
  if (!recentre) return pts;
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return pts.map(([x, y]) => [Math.min(.92, Math.max(.08, x - cx + .5)), Math.min(.92, Math.max(.08, y - cy + .5))]);
}
function scatter(n) {
  let d = 58 / (board.clientWidth || 360);
  const pts = [];
  for (let i = 0; i < n; i++) {
    let p, tries = 0;
    do { p = [.09 + Math.random() * .82, .09 + Math.random() * .82]; if (++tries % 150 === 0) d *= .9; }
    while (pts.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < d));
    pts.push(p);
  }
  return pts;
}
// A "roll" fixes the random choices (letter order, orientation, noise, scatter spots)
// so sliders can reshape the layout live without reshuffling every tick.
let roll = null, gatherTimer = null;
function reroll() {
  const n = tiles.length;
  roll = {
    order: shuffle([...Array(n).keys()]),
    off: Math.random() * Math.PI * 2,
    dir: Math.random() < .5 ? 1 : -1,
    jit: Array.from({ length: n }, () => [Math.random() * 2 - 1, Math.random() * 2 - 1]),
    rot: Array.from({ length: n }, () => Math.random() * 2 - 1),
    loose: scatter(n),
    circle: circle(n),
  };
}
function place_(pts, tilt) {
  roll.order.forEach((ti, i) => { const t = tiles[ti]; [t.x, t.y] = pts[i]; t.rot = roll.rot[i] * tilt; });
}
function arrange(animate) {
  clearTimeout(gatherTimer);
  const n = tiles.length; if (!n) return;
  if (!roll || roll.order.length !== n) reroll();
  if (layout === 'circle') place_(roll.circle, 6);
  else if (layout === 'spiral') place_(settings.noise > 0 ? relax(spiral(n), 40, 0, 40, false) : spiral(n), 6);
  else if (!settings.gather) place_(roll.loose, 18);
  else if (animate) {
    // show the loose scatter first, then drag it into the middle
    place_(roll.loose, 18); render();
    gatherTimer = setTimeout(() => { place_(gather(roll.loose), 18); render(); }, 450);
  } else place_(gather(roll.loose), 18);
}

// ---- rendering ----
function renderTile(t) {
  t.el.style.left = (t.x * 100) + '%';
  t.el.style.top = (t.y * 100) + '%';
  t.el.style.transform = `rotate(${t.rot}deg)`;
  t.el.classList.toggle('used', t.used);
}
function renderSlots() {
  slotsEl.innerHTML = '';
  slots.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'slot' + (s.fixed ? ' fixed' : '') + (s.gap ? ' gap' : '');
    d.dataset.i = i;
    d.textContent = s.fixed || (s.tile != null ? tiles[s.tile].ch : '');
    d.addEventListener('click', () => {
      if (s.fixed || s.tile == null) return;
      tiles[s.tile].used = false; s.tile = null; render();
    });
    slotsEl.appendChild(d);
  });
}
function renderCount() {
  const n = tiles.length, m = slots.length;
  if (!n) { countEl.innerHTML = ''; return; }
  countEl.innerHTML = patIn.value.trim()
    ? `${n} letters · answer ${m}` + (n !== m ? ` <span class="bad">(${n > m ? n - m + ' spare' : m - n + ' short'})</span>` : '')
    : `${n} letters`;
}
function render() {
  hint.style.display = tiles.length ? 'none' : 'flex';
  tiles.forEach(renderTile);
  renderSlots();
  renderCount();
}

// ---- placing letters ----
const nextEmpty = () => { const i = slots.findIndex(s => !s.fixed && s.tile == null); return i < 0 ? null : i; };
function place(t, i) {
  const s = slots[i];
  if (!s || s.fixed) return;
  if (s.tile != null) tiles[s.tile].used = false;
  s.tile = t.id; t.used = true;
}
function slotAt(x, y) {
  const els = slotsEl.querySelectorAll('.slot');
  for (const el of els) {
    const r = el.getBoundingClientRect(), pad = 10;
    if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return el;
  }
  return null;
}

function onDown(e) {
  const el = e.currentTarget, t = tiles[el.dataset.id];
  if (t.used) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  let moved = false, over = null;
  el.classList.add('drag');

  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.hypot(dx, dy) > 6) moved = true;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${t.rot}deg) scale(1.25)`;
    const s = slotAt(ev.clientX, ev.clientY);
    if (s !== over) { over && over.classList.remove('over'); over = s; over && over.classList.add('over'); }
  };
  const up = ev => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);
    el.classList.remove('drag');
    over && over.classList.remove('over');
    if (ev.type === 'pointerup') {
      if (moved) { const s = slotAt(ev.clientX, ev.clientY); if (s) place(t, +s.dataset.i); }
      else { const i = nextEmpty(); if (i != null) place(t, i); }   // tap = next empty slot
    }
    render();
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

// ---- controls ----
fodderIn.addEventListener('input', build);
patIn.addEventListener('input', () => { buildSlots(); render(); });
[fodderIn, patIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); }));
function syncControls() {
  document.querySelectorAll('[data-layout]').forEach(x => x.classList.toggle('on', x.dataset.layout === layout));
  document.querySelectorAll('[data-gather]').forEach(x => x.classList.toggle('on', +x.dataset.gather === +settings.gather));
  $('#opt-spiral').classList.toggle('show', layout === 'spiral');
  $('#opt-scatter').classList.toggle('show', layout === 'scatter');
  $('#turns').value = settings.turns; $('#noise').value = settings.noise;
  $('#turnsOut').textContent = (+settings.turns) + (settings.turns == 1 ? ' turn' : ' turns');
  $('#noiseOut').textContent = settings.noise + '%';
}
document.querySelectorAll('[data-layout]').forEach(b => b.addEventListener('click', () => {
  layout = settings.layout = b.dataset.layout; save(); syncControls();
  if (tiles.length) reroll();
  arrange(true); render();
}));
document.querySelectorAll('[data-gather]').forEach(b => b.addEventListener('click', () => {
  settings.gather = +b.dataset.gather; save(); syncControls();
  arrange(true); render();     // same scatter, now loose or gathered
}));
['turns', 'noise'].forEach(id => $('#' + id).addEventListener('input', e => {
  settings[id] = +e.target.value; save(); syncControls();
  arrange(false); render();    // reshape live, same letters
}));
$('#shuffle').addEventListener('click', () => { if (tiles.length) reroll(); arrange(true); render(); });
syncControls();
$('#clear').addEventListener('click', () => { buildSlots(); render(); });
</script>
</body>
</html>
